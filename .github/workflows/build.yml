name: Build mod
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q -o qolclient.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        working-directory: qolclient
        run: gradle build --no-daemon --stacktrace
      - name: Keep only the mod jar
        run: |
          rm -f qolclient/build/libs/*-sources.jar
          ls -l qolclient/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: qolclient-jar
          path: qolclient/build/libs/*.jar
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QoL Client build ${{ github.run_number }}
          files: qolclient/build/libs/*.jar
